<script>
const D=/*__DATA__*/null/*__END__*/;
const TODAY=D.today,ACTS=D.acts,DAYS=D.days,A=D.A,CFG=D.cfg;
const PER={"1S":7,"1M":30,"3M":90},PLAB={"1S":"1 semaine glissante","1M":"1 mois glissant","3M":"3 mois glissants"};
const SPN={run:"Course",trail:"Trail",bike:"Vélo",swim:"Natation",strength:"Musculation",walk:"Marche",other:"Autre"};
const SPO=["run","trail","bike","swim","strength","walk","other"];
const q0=new URLSearchParams(location.search);
const state={g:PER[q0.get("p")]?q0.get("p"):"1M",loc:{},fit:true};
if(q0.get("print"))document.body.classList.add("print");
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const fmt=(v,d=0)=>v==null||isNaN(v)?"–":Number(v).toFixed(d).replace(".",",");
const fp=v=>{if(!v)return"–";let m=Math.floor(v),s=Math.round((v-m)*60);if(s===60){m++;s=0}return m+"'"+String(s).padStart(2,"0")};
const fh=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h${String(m).padStart(2,"0")}'${String(s).padStart(2,"0")}`:`${m}'${String(s).padStart(2,"0")}`};
const fdur=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}h${String(m).padStart(2,"0")}`:`${m} min`};
const addDays=(d,n)=>{const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dm=d=>d.slice(8)+"/"+d.slice(5,7);
const dayDiff=d=>Math.round((Date.parse(TODAY)-Date.parse(d))/864e5);
const mean=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const per=sec=>state.loc[sec]||state.g;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssv={};
function col(k){if(!k)return"#888";if(k[0]==="#"||k.startsWith("rgb")||k.startsWith("hsl"))return k;if(!cssv[k])cssv[k]=getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()||"#888";return cssv[k]}
const THEME_ICON={light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>'};
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function themeBtn(){const t=curTheme();$("#theme").innerHTML=(t==="dark"?THEME_ICON.light+"<span class=\"tl\">Mode clair</span>":THEME_ICON.dark+"<span class=\"tl\">Mode sombre</span>");$("#theme").setAttribute("aria-pressed",t==="dark")}
function setTheme(t,save){document.documentElement.dataset.theme=t;for(const k in cssv)delete cssv[k];if(save)try{localStorage.setItem("gd_theme",t)}catch(e){}themeBtn();if(document.body.classList.contains("ready"))render()}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(document.documentElement.dataset.theme)return;for(const k in cssv)delete cssv[k];themeBtn();render()});
/* ---------- moteur de graphiques SVG ---------- */
function niceTicks(lo,hi,cnt){if(!isFinite(lo)||!isFinite(hi)){lo=0;hi=1}if(lo===hi)hi=lo+1;const raw=(hi-lo)/cnt,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag,step=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag;const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(8));return t}
function regress(pts){const n=pts.length;if(n<3)return null;const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));let sxx=0,sxy=0;pts.forEach(p=>{sxx+=(p[0]-mx)**2;sxy+=(p[0]-mx)*(p[1]-my)});if(!sxx)return null;const b=sxy/sxx;return{a:my-b*mx,b}}
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-10;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+16;tip.style.left=x+"px";tip.style.top=y+"px"}
const hideTip=()=>{tip.style.opacity=0};
function chart(el,s){
  const W=640,H=s.h||230,ml=s.ml||44,mr=s.y2?46:14,mt=12,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  const lg=s.ys.filter(q=>q.name).map(q=>`<span><i style="background:${col(q.c)}"></i>${q.name}</span>`).join("")+(state.fit&&s.ys.some(q=>q.fit)?`<span style="color:var(--sub)">- - tendance</span>`:"");
  const has=s.ys.some(q=>q.d.some(v=>v!=null&&(typeof v!=="object"||v.y!=null)));
  if(!has){el.innerHTML=`<div class="empty">${s.empty||"Pas de données sur cette période"}</div>`;return}
  const num=!!s.xr,n=s.n||0;
  const X=num?v=>ml+(v-s.xr[0])/((s.xr[1]-s.xr[0])||1)*pw:i=>ml+(i+.5)/n*pw;
  const axd=[0,1].map(a=>{
    const ser=s.ys.filter(q=>(q.ax||0)===a);if(!ser.length)return null;
    let lo=Infinity,hi=-Infinity,bar=false;const st=new Array(n).fill(0);
    ser.forEach(q=>{if(q.t==="bar"){bar=true;q.d.forEach((v,i)=>{st[i]+=v||0})}else q.d.forEach(v=>{const y=v&&typeof v==="object"?v.y:v;if(y!=null){lo=Math.min(lo,y);hi=Math.max(hi,y)}})});
    if(bar){lo=Math.min(lo,0);hi=Math.max(hi,...st)}
    (s.hl||[]).filter(h=>(h.ax||0)===a).forEach(h=>{lo=Math.min(lo,h.y);hi=Math.max(hi,h.y)});
    (s.band||[]).filter(b=>(b.ax||0)===a).forEach(b=>{lo=Math.min(lo,b.y0);hi=Math.max(hi,b.y1)});
    const o=(a?s.y2:s.y)||{};if(o.min!=null)lo=o.min;if(o.max!=null)hi=o.max;if(!isFinite(lo)){lo=0;hi=1}if(lo===hi)hi=lo+1;
    const pad=(bar||o.min!=null)?0:(hi-lo)*.1;
    const t=niceTicks(o.min!=null?lo:lo-pad,o.max!=null?hi:hi+(bar?(hi-lo)*.05:pad),4);
    const d0=o.min!=null?lo:t[0],d1=o.max!=null?hi:t[t.length-1];
    return{t:t.filter(v=>v>=d0-1e-9&&v<=d1+1e-9),d0,d1,f:o.f||(v=>fmt(v,Math.abs(v)<10&&Math.abs(v%1)>1e-6?1:0)),rev:!!o.rev}});
  const Y=(a,v)=>{const g=axd[a],r=(v-g.d0)/(g.d1-g.d0||1);return mt+ph*(g.rev?r:1-r)};
  let g="";
  (s.band||[]).forEach(b=>{const a=b.ax||0;if(!axd[a])return;const y1=Y(a,b.y1),y0=Y(a,b.y0);g+=`<rect x="${ml}" y="${Math.min(y0,y1)}" width="${pw}" height="${Math.abs(y0-y1)}" fill="${col(b.c||"green")}" opacity="${b.o||.13}"/>`});
  (s.marks||[]).forEach(m=>{const x=X(m.i);g+=`<g><title>${esc(m.l)} · ${m.d}</title><line x1="${x}" x2="${x}" y1="${mt}" y2="${mt+ph}" stroke="${col(m.c)}" stroke-width="1.4" stroke-dasharray="3 3" opacity=".75"/><text x="${Math.min(x+3,W-mr-4)}" y="${mt+9}" class="ax" style="fill:${col(m.c)};font-size:9px" ${x>W-mr-70?'text-anchor="end" dx="-6"':""}>${esc(m.l)}</text></g>`});
  axd[0].t.forEach(v=>{const y=Y(0,v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" class="gl"/><text x="${ml-6}" y="${y+3}" text-anchor="end" class="ax">${axd[0].f(v)}</text>`});
  if(axd[1])axd[1].t.forEach(v=>{g+=`<text x="${W-mr+6}" y="${Y(1,v)+3}" class="ax">${axd[1].f(v)}</text>`});
  if(!num){const k=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(pw/50))));for(let i=0;i<n;i+=k)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${s.xl[i]}</text>`}
  else(s.xt||[]).forEach(t=>{g+=`<text x="${X(t.v)}" y="${H-8}" text-anchor="middle" class="ax">${t.l}</text>`});
  const bw=Math.min(30,pw/Math.max(n,1)*.64),acc=new Array(n).fill(0);
  s.ys.filter(q=>q.t==="bar").forEach(q=>{const a=q.ax||0;q.d.forEach((v,i)=>{if(!v)return;const y0=Y(a,acc[i]),y1=Y(a,acc[i]+v);g+=`<rect x="${X(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" rx="3" fill="${col(q.cs?q.cs[i]:q.c)}" opacity="${q.o||1}"/>`;acc[i]+=v})});
  s.ys.filter(q=>q.t==="line").forEach(q=>{const a=q.ax||0;let d="",pen=false;q.d.forEach((v,i)=>{if(v==null){if(!q.join)pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(a,v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${col(q.c)}" stroke-width="${q.w||2.2}" stroke-linecap="round" stroke-linejoin="round" ${q.dash?'stroke-dasharray="5 4"':""} opacity="${q.o||1}"/>`;
    if(q.dots!==false&&n<=31)q.d.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(a,v)}" r="2.7" fill="${col(q.c)}"/>`})});
  if(state.fit)s.ys.forEach(q=>{if(!q.fit)return;const a=q.ax||0;const pts=q.t==="dot"?q.d.filter(p=>p.y!=null).map(p=>[p.x,p.y]):q.d.map((v,i)=>v==null?null:[i,v]).filter(Boolean);const r=regress(pts);if(!r)return;const x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0]));

function gOpen(){window.__gleave=0;const el=$("#gsub");el.innerHTML=`<div class="gwrap"><div class="gtop"><button class="tbtn" id="gback" type="button">← Retour</button><span class="gdirty" id="gdirty">● Modifications non enregistrées</span></div><h2>Mes objectifs</h2><p class="sm">Classés automatiquement par date. Enregistrés dans <b>${esc(GH.goals_path)}</b> (dépôt GitHub) et pris en compte à la prochaine synchronisation.</p><div id="grows">${gRows()}</div><div class="gmsg" id="gmsg"></div>${tokBox()}</div><div class="gbar"><button class="tbtn" id="gadd" type="button">＋ Ajouter</button><button class="tbtn pri" id="gsave" type="button">Enregistrer</button><button class="tbtn" id="gsavesync" type="button">Enregistrer + synchroniser</button></div>`;el.classList.add("on");document.body.style.overflow="hidden";el.scrollTop=0}
function tokBox(){const has=!!tokGet();return`<details class="gtok"${has?"":" open"}><summary>🔑 Connexion GitHub · ${has?"✓ jeton enregistré sur cet appareil":"jeton requis (une seule fois par appareil)"}</summary><p>Jeton « fine-grained » limité au dépôt <i>${esc(GH.repo)}</i> avec les droits <i>Contents</i> et <i>Actions</i> en lecture/écriture. Il reste uniquement dans ce navigateur.</p><input id="gtok" type="password" autocomplete="off" placeholder="${has?"•••••••• (laisser vide pour conserver)":"github_pat_…"}">${has?'<button class="tbtn" id="gtokdel" type="button">Oublier le jeton</button>':""}</details>`}
function gMsg(m,c){const e=$("#gmsg");if(e){e.textContent=m;e.className="gmsg "+(c||"")}}
function gDirty(on){const e=$("#gdirty");if(e)e.classList.toggle("on",!!on)}
function gRead(){const rows=[...document.querySelectorAll("#grows .gcard")];GL=rows.map((r,k)=>{const o={...(GL[k]||{}),sport:r.dataset.sport};if(r.dataset.fmt)o.format=r.dataset.fmt;if(r.dataset.pr!=="")o.pr=r.dataset.pr==="1";if(r.dataset.ev!=="")o.ev=r.dataset.ev==="1";o.prio=r.dataset.prio||"";r.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim());return o})}
function gLive(card){const k=+card.dataset.i;gRead();const o=GL[k];card.querySelector(".gbadge").textContent=gBadge(o);card.querySelector(".gbadge").classList.toggle("past",gBadge(o)==="passé");card.querySelector(".gpace").textContent=gPace(o)}
let gErr=null,gUndo=null;const bad=(i,f,m)=>{gErr={i,f};return m};
function gHi(){if(!gErr)return;const {i,f}=gErr;gErr=null;const c=document.querySelectorAll("#grows .gcard")[i];if(!c)return;c.scrollIntoView({behavior:"smooth",block:"center"});const x=c.querySelector(`[data-f="${f}"]`);if(x){x.classList.add("bad");x.focus({preventScroll:true})}}
function gValid(){const out=[];for(const [i,g] of GL.entries()){const n="Objectif "+(i+1)+" : ";if(!g.name)return bad(i,"name",n+"donnez un nom à la course.");if(!/^\d{4}-\d{2}-\d{2}$/.test(g.date||""))return bad(i,"date",n+"choisissez une date.");const sp=g.sport||"run";const o={sport:sp,name:g.name,date:g.date};if(["A","B","C"].includes(g.prio))o.prio=g.prio;
 if(sp==="triathlon"){o.format=g.format&&(TRI[g.format]||g.format==="custom")?g.format:"m";if(triPr(g)){for(const k of["swim","bike","run"]){const v=num(g[k]);if(g[k]&&v==null)return bad(i,k,n+"distance invalide.");o[k]=v||0}if(!(o.swim+o.bike+o.run>0))return bad(i,"swim",n+"précisez au moins une distance.");for(const k of["bike_elev","run_elev"]){const v=num(g[k]);if(g[k]&&v==null)return bad(i,k,n+"dénivelé invalide.");if(v!=null)o[k]=v}}}
 else{const d=num(g.dist);if(!(d>0))return bad(i,"dist",n+"indiquez une distance en km.");o.dist=d;if(sp!=="swim"&&g.elev){const e=num(g.elev);if(e==null)return bad(i,"elev",n+"dénivelé invalide.");o.elev=e}}
 o.dist=gDist(o);const t=parseT(g.target,gHM(o));if(t===null)return bad(i,"target",n+"temps visé illisible (ex. 42:00 ou 3:15:00).");o.target=t===""?"":fmtT(t);out.push(o)}GL=out;gSort();return""}
async function gSave(){gRead();const tk=$("#gtok");if(tk&&tk.value.trim()){tokSet(tk.value.trim());tk.value=""}const err=gValid();if(err){$("#grows").innerHTML=gRows();gMsg(err,"err");gHi();return false}
 gMsg("Enregistrement…");try{let sha;try{sha=(await(await ghApi("/contents/"+GH.goals_path+"?ref="+GH.branch)).json()).sha}catch(e){if(e.status!==404)throw e}
 const body={message:"Mise à jour des objectifs (dashboard)",content:b64e(JSON.stringify({version:1,goals:GL},null,2)+"\n"),branch:GH.branch};if(sha)body.sha=sha;
 await ghApi("/contents/"+GH.goals_path,{method:"PUT",body:JSON.stringify(body)});$("#grows").innerHTML=gRows();gDirty(false);gMsg("✓ Objectifs enregistrés (triés par date). Ils seront intégrés à la prochaine synchronisation.","ok");return true}catch(e){gMsg(e.message,"err");return false}}
async function gDispatch(days){try{try{await ghApi("/actions/workflows/"+GH.workflow+"/dispatches",{method:"POST",body:JSON.stringify({ref:GH.branch,inputs:{days:String(days),send_mail:"false"}})})}catch(e){if(e.status!==422)throw e;await ghApi("/actions/workflows/"+GH.workflow+"/dispatches",{method:"POST",body:JSON.stringify({ref:GH.branch})});return"partial"}return"ok"}catch(e){return e.message}}
function sOpen(msgBox){const el=$("#gsync");el.innerHTML=`<div class="gmod"><h3>Synchronisation</h3><p class="sm">Lance l'action GitHub « ${esc(GH.workflow)} » : récupération Garmin, analyse, publication. Compter 2 à 5 minutes avant de recharger la page.</p><label class="sm">Jours à synchroniser<input id="sdays" type="number" min="1" max="365" value="${GH.sync_days||3}"></label><div class="gmsg" id="smsg"></div>${tokGet()?"":'<div class="gtok">Jeton GitHub requis (voir « MàJ des objectifs » pour les droits).<input id="stok" type="password" placeholder="github_pat_…"></div>'}<div class="gbar"><button class="tbtn pri" id="sgo" type="button">Lancer</button><button class="tbtn" id="sx" type="button">Fermer</button></div></div>`;el.classList.add("on")}
document.addEventListener("click",async e=>{const id=e.target.closest("button,#gsync")&&(e.target.closest("button")||{}).id;
 if(e.target.id==="gsync"){$("#gsync").classList.remove("on");return}
 if(id==="bgoals"){gOpen();return}if(id==="bsync"){sOpen();return}
 if(id==="gback"){const dirty=$("#gdirty")&&$("#gdirty").classList.contains("on");if(dirty&&!window.__gleave){window.__gleave=1;gMsg("Modifications non enregistrées : cliquez sur « Enregistrer », ou sur « Retour » pour quitter sans enregistrer.","err");return}window.__gleave=0;$("#gsub").classList.remove("on");document.body.style.overflow="";return}
 if(id==="gadd"){gRead();GL.push({sport:"run",name:"",dist:"",target:"",date:""});$("#grows").innerHTML=gRows();gDirty(true);const r=document.querySelectorAll("#grows .gcard");const L=r[r.length-1];L.scrollIntoView({behavior:"smooth",block:"center"});L.querySelector("[data-f=name]").focus();return}
 const pz=e.target.closest("[data-prio-set]");if(pz){gRead();GL[+pz.closest(".gcard").dataset.i].prio=pz.dataset.prioSet;$("#grows").innerHTML=gRows();gDirty(true);return}
 const sp=e.target.closest("[data-sp]");if(sp){gRead();const gg=GL[+sp.closest(".gcard").dataset.i];gg.sport=sp.dataset.sp;delete gg.pr;delete gg.ev;if(gg.sport==="triathlon"&&!gg.format)gg.format="m";$("#grows").innerHTML=gRows();gDirty(true);return}
 const fm=e.target.closest("[data-fmt]");if(fm&&fm.tagName==="BUTTON"){gRead();const gg=GL[+fm.closest(".gcard").dataset.i],pr=triPr(gg);gg.format=fm.dataset.fmt;{const T=TRI[gg.format];if(pr){gg.swim=T[0];gg.bike=T[1];gg.run=T[2]}if(!T[1])delete gg.bike_elev;if(!T[2])delete gg.run_elev}gg.pr=pr;$("#grows").innerHTML=gRows();gDirty(true);return}
 const tp=e.target.closest("[data-tripr]");if(tp){gRead();const gg=GL[+tp.closest(".gcard").dataset.i];if(triPr(gg)){gg.pr=false;if(TRI[gg.format]){delete gg.swim;delete gg.bike;delete gg.run}delete gg.bike_elev;delete gg.run_elev}else{const T=gTri(gg);gg.swim=T[0];gg.bike=T[1];gg.run=T[2];gg.pr=true}$("#grows").innerHTML=gRows();gDirty(true);return}
 const rn=e.target.closest("[data-run]");if(rn){gRead();const gg=GL[+rn.closest(".gcard").dataset.i],k=rn.dataset.run;if(k==="custom"){gg.pr=true}else{const f=RUNF.find(x=>x[0]===k);gg.dist=nf(f[2]);gg.pr=false;if(!gg.name)gg.name=f[1]==="Semi-marathon"?"Semi-marathon":f[1]}$("#grows").innerHTML=gRows();gDirty(true);return}
 const el=e.target.closest("[data-elev]");if(el){gRead();const gg=GL[+el.closest(".gcard").dataset.i];gg.ev=!(gg.ev!=null?gg.ev:!!gg.elev);if(!gg.ev)gg.elev="";$("#grows").innerHTML=gRows();gDirty(true);return}
 const pr=e.target.closest("[data-pre]");if(pr){const c=pr.closest(".gcard"),inp=c.querySelector("[data-f=dist]");inp.value=String(+(+pr.dataset.pre).toFixed(3)).replace(".",",");const nm=c.querySelector("[data-f=name]");if(!nm.value&&c.dataset.sport==="run")nm.value=pr.textContent==="Semi"?"Semi-marathon":pr.textContent;gLive(c);gDirty(true);return}
 const del=e.target.closest("[data-del]");if(del){gRead();const k=+del.dataset.del;gUndo={g:GL[k],k};GL.splice(k,1);$("#grows").innerHTML=gRows();gDirty(true);const m=$("#gmsg");m.className="gmsg";m.innerHTML='Objectif supprimé · <button class="glink" id="gundo" type="button">Annuler</button>';return}
 if(id==="gundo"&&gUndo){gRead();GL.splice(gUndo.k,0,gUndo.g);gUndo=null;$("#grows").innerHTML=gRows();gMsg("Objectif rétabli.","ok");return}
 if(id==="gtokdel"){tokSet("");$(".gtok").outerHTML=tokBox();return}
 if(id==="gsave"){await gSave();return}
 if(id==="gsavesync"){if(await gSave()){gMsg("✓ Enregistré. Lancement de la synchronisation…","ok");const r=await gDispatch(GH.sync_days||3);gMsg(r==="ok"||r==="partial"?"✓ Enregistré et synchronisation lancée. Rechargez la page dans quelques minutes.":r,r==="ok"||r==="partial"?"ok":"err")}return}
 if(id==="sx"){$("#gsync").classList.remove("on");return}
 if(id==="sgo"){const st=$("#stok");if(st&&st.value.trim())tokSet(st.value.trim());const d=Math.max(1,Math.min(365,parseInt($("#sdays").value)||3));const m=$("#smsg");m.className="gmsg";m.textContent="Lancement…";const r=await gDispatch(d);if(r==="ok"||r==="partial"){m.className="gmsg ok";m.textContent=r==="ok"?"✓ Synchronisation lancée sur "+d+" jour(s). Rechargez la page dans quelques minutes.":"✓ Synchronisation lancée (durée par défaut du workflow : l'option « days » n'est pas encore ajoutée à daily.yml)."}else{m.className="gmsg err";m.textContent=r}return}
});
document.addEventListener("input",e=>{const c=e.target.closest&&e.target.closest("#grows .gcard");if(c){gLive(c);gDirty(true);e.target.classList.remove("bad")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#gsync").classList.remove("on");if($("#gsub").classList.contains("on")){$("#gsub").classList.remove("on");document.body.style.overflow=""}}});
render();
{const h=location.hash.slice(1);if(FOLD.includes(h)){toggleFold(h,true);$("#"+h).scrollIntoView()}}
